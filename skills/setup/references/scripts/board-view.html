<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--BOARD:title--> board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --column: #eef0f3;
    --border: #d9dde3;
    --text: #1c2026;
    --muted: #5f6b7a;
    --accent: #2f6fde;
    --flag: #d92d20;
    --blocked-fg: #9a5b00;
    --cleanup-bg: #fde7e7;
    --cleanup-fg: #b42318;
    --detail-bg: #eceff3;
    --detail-fg: #4a5565;
    --shadow: 0 8px 32px rgba(16, 24, 40, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --surface: #1d2128;
      --column: #181b21;
      --border: #2e343e;
      --text: #e6e9ee;
      --muted: #98a2b3;
      --accent: #6ea2ff;
      --flag: #ff6b5e;
      --blocked-fg: #ffb84d;
      --cleanup-bg: rgba(255, 69, 58, 0.16);
      --cleanup-fg: #ff8a80;
      --detail-bg: #262b33;
      --detail-fg: #b4bdc9;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  code, .id, .rank { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header.top { margin-bottom: 16px; }
  header.top h1 { margin: 0 0 4px; font-size: 20px; }
  .meta { margin: 0; color: var(--muted); font-size: 12.5px; }
  .notice {
    display: inline-block;
    margin: 8px 0 0;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--cleanup-bg);
    color: var(--cleanup-fg);
    font-size: 12.5px;
  }
  main.board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(200px, 280px) minmax(200px, 280px);
    gap: 16px;
    align-items: start;
  }
  .column {
    background: var(--column);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    min-width: 0;
  }
  .column > h2 {
    margin: 2px 4px 10px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
    gap: 8px;
  }
  .group + .group { margin-top: 14px; }
  .group h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .group-toggle {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 2px 4px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .group-toggle::before { content: "▾"; color: var(--muted); }
  .group.collapsed .group-toggle::before { content: "▸"; }
  .group-toggle:hover { background: var(--detail-bg); }
  .group-toggle .count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .group.collapsed .cards, .group.collapsed .empty { display: none; }
  .card {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
    transition: border-color 0.12s, opacity 0.12s;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible, .card.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card.blocked { opacity: 0.55; }
  .card.blocked:hover, .card.blocked.selected { opacity: 0.9; }
  .card-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .rank { flex: none; min-width: 1.4em; color: var(--muted); font-size: 12px; }
  .flag { flex: none; color: var(--flag); font-weight: 700; }
  .card .id {
    flex: 0 1 auto;
    min-width: 0;
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .badges {
    flex: 0 1000 auto;
    display: flex;
    gap: 4px;
    min-width: 0;
    margin-left: auto;
    overflow: hidden;
  }
  .card .title, .card .summary, .card .meta {
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .title { font-weight: 600; }
  .card code { font-size: 0.9em; }
  .card.blocked .meta { color: var(--blocked-fg); }
  .card .title + .summary { color: var(--muted); font-size: 13px; }
  .badge {
    min-width: 0;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge.cleanup { background: var(--cleanup-bg); color: var(--cleanup-fg); }
  .badge.detail { background: var(--detail-bg); color: var(--detail-fg); }
  .empty { margin: 4px; color: var(--muted); font-style: italic; }
  aside.panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(460px, 100vw);
    overflow-y: auto;
    padding: 20px 22px 32px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  aside.panel[hidden] { display: none; }
  .panel .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  .panel h2 { margin: 0 40px 4px 0; font: 600 17px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .panel .title { margin: 4px 0 6px; font-size: 16px; font-weight: 600; }
  .panel .summary { margin: 10px 0; font-size: 14.5px; }
  .panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0; font-size: 13px; }
  .panel dt { color: var(--muted); }
  .panel dd { margin: 0; }
  .issue { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 6px; }
  .issue h3, .issue h4, .issue h5 { margin: 14px 0 6px; }
  .issue h3 { font-size: 15px; }
  .issue h4 { font-size: 14px; }
  .issue h5 { font-size: 13px; color: var(--muted); }
  .issue p, .issue ul, .issue ol { margin: 6px 0; }
  .issue ul, .issue ol { padding-left: 20px; }
  .issue blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); }
  .issue code { padding: 0 3px; border-radius: 4px; background: var(--detail-bg); }
  .issue pre { overflow-x: auto; padding: 8px 10px; border-radius: 6px; background: var(--column); }
  @media (max-width: 1100px) {
    main.board { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    body { padding: 16px; }
  }
</style>
</head>
<body>
<header class="top">
<!--BOARD:header-->
</header>
<main class="board">
<section class="column todo">
<h2>ToDo</h2>
<!--BOARD:todo-->
</section>
<section class="column in-progress">
<h2>In Progress</h2>
<!--BOARD:in-progress-->
</section>
<section class="column done">
<h2>Done</h2>
<!--BOARD:done-->
</section>
</main>
<aside class="panel" id="panel" hidden>
<button class="close" type="button" aria-label="Close">×</button>
<div id="panel-body"></div>
</aside>
<!--BOARD:details-->
<script>
(function () {
  var panel = document.getElementById('panel');
  var body = document.getElementById('panel-body');
  var current = null;
  function close() {
    panel.hidden = true;
    if (current) current.classList.remove('selected');
    current = null;
  }
  function open(card) {
    var detail = document.getElementById('detail-' + card.dataset.card);
    if (!detail) return;
    if (current) current.classList.remove('selected');
    current = card;
    card.classList.add('selected');
    body.replaceChildren(detail.content.cloneNode(true));
    panel.hidden = false;
  }
  document.querySelectorAll('article.card').forEach(function (card) {
    card.tabIndex = 0;
    card.addEventListener('click', function () { open(card); });
    card.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(card); }
    });
  });
  panel.querySelector('.close').addEventListener('click', close);
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });

  // Collapsed groups are remembered per project in this browser. Storage can be missing or
  // refuse access (a private window, blocked site data); the page then starts with every group open.
  var key = 'board-view:collapsed:' + document.title;
  function loadCollapsed() {
    try {
      var names = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(names) ? names : [];
    } catch (error) {
      return [];
    }
  }
  function saveCollapsed(names) {
    try { localStorage.setItem(key, JSON.stringify(names)); } catch (error) {}
  }
  var collapsed = loadCollapsed();
  document.querySelectorAll('section.group[data-group]').forEach(function (group) {
    var name = group.dataset.group;
    var toggle = group.querySelector('.group-toggle');
    function show(isCollapsed) {
      group.classList.toggle('collapsed', isCollapsed);
      toggle.setAttribute('aria-expanded', String(!isCollapsed));
    }
    show(collapsed.indexOf(name) !== -1);
    toggle.addEventListener('click', function () {
      var isCollapsed = !group.classList.contains('collapsed');
      show(isCollapsed);
      var names = loadCollapsed().filter(function (other) { return other !== name; });
      if (isCollapsed) names.push(name);
      saveCollapsed(names);
    });
  });
})();
</script>
</body>
</html>
